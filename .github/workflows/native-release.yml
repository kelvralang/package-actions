name: Native package release

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      runtime_ref:
        default: main
        type: string
      targets:
        default: '["linux-x86_64-gnu","linux-arm64-gnu","macos-arm64"]'
        type: string
      working_directory:
        default: .
        type: string
      test_fixture:
        default: .github/package-test.toml.in
        type: string
      test_command:
        default: ""
        type: string
      system_dependencies_command:
        default: ""
        type: string
      runtime_cmake_flags:
        default: ""
        type: string
      package_cmake_flags:
        default: ""
        type: string
      artifact_path:
        description: Built module path relative to the package build directory.
        default: package.so
        type: string
      publish_release:
        description: Publish a GitHub Release. Set false only in contract fixtures.
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.targets.outputs.value }}
    steps:
      - id: targets
        env:
          TARGETS: ${{ inputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          value="$(jq -ce '
            if type != "array" or length == 0 then error("targets must be a non-empty array") else . end
            | map(
                if . == "linux-x86_64-gnu" then {target: ., runner: "ubuntu-latest"}
                elif . == "linux-arm64-gnu" then {target: ., runner: "ubuntu-24.04-arm"}
                elif . == "macos-arm64" then {target: ., runner: "macos-14"}
                else error("unsupported target: \(.)") end
              )
            | {include: .}
          ' <<< "$TARGETS")"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.value) }}
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      WORKING_DIRECTORY: ${{ inputs.working_directory }}
      TEST_COMMAND: ${{ inputs.test_command }}
      SYSTEM_DEPENDENCIES_COMMAND: ${{ inputs.system_dependencies_command }}
      RUNTIME_CMAKE_FLAGS: ${{ inputs.runtime_cmake_flags }}
      PACKAGE_CMAKE_FLAGS: ${{ inputs.package_cmake_flags }}
      ARTIFACT_PATH: ${{ inputs.artifact_path }}
      TEST_FIXTURE: ${{ inputs.test_fixture }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/kelvra
          ref: ${{ inputs.runtime_ref }}
          path: .package-actions-runtime/kelvra
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          name="$(sed -n 's/^name = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          kind="$(sed -n 's/^kind = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          license="$(sed -n 's/^license = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          test -n "$version"
          test "$name" = "$PACKAGE_NAME"
          test "$kind" = native
          test -f LICENSE
          test -f README.md
          test -f CHANGELOG.md
          test -f NativePackageAPI.hpp
          test -f package.api.kel
          test -f tests/main.kel
          grep -Fq "## $version" CHANGELOG.md
          grep -q '^```kelvra' README.md
          grep -Fq "\"$TARGET\"" kelvra.toml
          case "$license" in
            GPL-3.0-only) grep -Fq "GNU GENERAL PUBLIC LICENSE" LICENSE ;;
            MIT) grep -Fq "MIT License" LICENSE ;;
            *) echo "Unsupported or unchecked license declaration: $license" >&2; exit 1 ;;
          esac
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          elif [[ "${{ inputs.publish_release }}" == true ]]; then
            echo "Publishing requires a v* tag ref." >&2
            exit 1
          fi
      - name: Install system dependencies
        if: inputs.system_dependencies_command != ''
        shell: bash
        run: bash -euo pipefail -c "$SYSTEM_DEPENDENCIES_COMMAND"
      - name: Build native package
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PACKAGE_CMAKE_FLAGS" ]]; then
            read -r -a extra_flags <<< "$PACKAGE_CMAKE_FLAGS"
            cmake -S "$WORKING_DIRECTORY" -B .package-actions-build/package \
              -DCMAKE_BUILD_TYPE=Release "${extra_flags[@]}"
          else
            cmake -S "$WORKING_DIRECTORY" -B .package-actions-build/package \
              -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build .package-actions-build/package --config Release --parallel
      - name: Build Kelvra runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RUNTIME_CMAKE_FLAGS" ]]; then
            read -r -a extra_flags <<< "$RUNTIME_CMAKE_FLAGS"
            cmake -S .package-actions-runtime/kelvra -B .package-actions-runtime/kelvra/build \
              -DCMAKE_BUILD_TYPE=Release "${extra_flags[@]}"
          else
            cmake -S .package-actions-runtime/kelvra -B .package-actions-runtime/kelvra/build \
              -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build .package-actions-runtime/kelvra/build --parallel
      - name: Validate and test package
        shell: bash
        env:
          KELVRA_RUNTIME: ${{ github.workspace }}/.package-actions-runtime/kelvra/build/interpreter
          PACKAGE_DIR: ${{ github.workspace }}/${{ inputs.working_directory }}
          BUILD_DIR: ${{ github.workspace }}/.package-actions-build/package
        run: |
          set -euo pipefail
          if [[ -n "$TEST_COMMAND" ]]; then
            bash -euo pipefail -c "$TEST_COMMAND"
          else
            module="$(sed -n 's/^module = "\([^"]*\)"/\1/p' "$PACKAGE_DIR/kelvra.toml" | head -n 1)"
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$PACKAGE_DIR/kelvra.toml" | head -n 1)"
            stage="$RUNNER_TEMP/packages/$module"
            project="$RUNNER_TEMP/package-test"
            mkdir -p "$(dirname "$stage")" "$project"
            rsync -a --exclude .git --exclude .package-actions-runtime --exclude .package-actions-build --exclude build \
              "$PACKAGE_DIR/" "$stage/"
            if [[ "$RUNNER_OS" == macOS ]]; then
              cp "$BUILD_DIR/$ARTIFACT_PATH" "$stage/package.dylib"
            else
              cp "$BUILD_DIR/$ARTIFACT_PATH" "$stage/package.so"
            fi
            "$KELVRA_RUNTIME" validate-package "$stage"
            sed -e "s|__PACKAGE_NAME__|$PACKAGE_NAME|g" \
                -e "s|__PACKAGE_MODULE__|$module|g" \
                -e "s|__PACKAGE_VERSION__|$version|g" \
                -e "s|__PACKAGE_PATH__|$stage|g" \
                "$PACKAGE_DIR/$TEST_FIXTURE" > "$project/kelvra.toml"
            cd "$project"
            KELVRA_CACHE_DIR="$RUNNER_TEMP/kelvra-cache" "$KELVRA_RUNTIME" run "$stage/tests/main.kel"
          fi
      - name: Bundle native artifact
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/$WORKING_DIRECTORY"
          build_dir="$GITHUB_WORKSPACE/.package-actions-build/package"
          test -f "$build_dir/$ARTIFACT_PATH"
          bundle="dist/$TARGET"
          mkdir -p "$bundle"
          cp "$package_dir/kelvra.toml" "$package_dir/package.api.kel" "$package_dir/LICENSE" \
            "$package_dir/README.md" "$package_dir/CHANGELOG.md" "$bundle/"
          if [[ "$RUNNER_OS" == macOS ]]; then
            cp "$build_dir/$ARTIFACT_PATH" "$bundle/package.dylib"
          else
            cp "$build_dir/$ARTIFACT_PATH" "$bundle/package.so"
          fi
          tar -C dist -czf "$PACKAGE_NAME-$TARGET.tar.gz" "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.package_name }}-${{ matrix.target }}
          path: ${{ inputs.package_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: ${{ inputs.package_name }}-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - name: Preserve release fixture artifacts
        if: inputs.publish_release == false
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.package_name }}-native-release-fixture
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
