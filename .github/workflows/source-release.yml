name: Source package release

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      runtime_ref:
        default: main
        type: string
      working_directory:
        default: .
        type: string
      test_fixture:
        default: .github/package-test.toml.in
        type: string
      test_command:
        default: ""
        type: string
      system_dependencies_command:
        default: ""
        type: string
      runtime_cmake_flags:
        default: ""
        type: string
      publish_release:
        description: Publish a GitHub Release. Set false only in contract fixtures.
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      WORKING_DIRECTORY: ${{ inputs.working_directory }}
      TEST_FIXTURE: ${{ inputs.test_fixture }}
      TEST_COMMAND: ${{ inputs.test_command }}
      SYSTEM_DEPENDENCIES_COMMAND: ${{ inputs.system_dependencies_command }}
      RUNTIME_CMAKE_FLAGS: ${{ inputs.runtime_cmake_flags }}
    steps:
      - name: Check out package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Kelvra runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/mog
          ref: ${{ inputs.runtime_ref }}
          path: .package-actions-runtime/kelvra
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          name="$(sed -n 's/^name = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          kind="$(sed -n 's/^kind = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          license="$(sed -n 's/^license = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          test -n "$version"
          test "$name" = "$PACKAGE_NAME"
          test "$kind" = source
          test -f LICENSE
          test -f README.md
          test -f CHANGELOG.md
          test -f package.api.kel
          test -f tests/main.kel
          grep -Fq "## $version" CHANGELOG.md
          grep -q '^```kelvra' README.md
          case "$license" in
            GPL-3.0-only) grep -Fq "GNU GENERAL PUBLIC LICENSE" LICENSE ;;
            MIT) grep -Fq "MIT License" LICENSE ;;
            *) echo "Unsupported or unchecked license declaration: $license" >&2; exit 1 ;;
          esac
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          elif [[ "${{ inputs.publish_release }}" == true ]]; then
            echo "Publishing requires a v* tag ref." >&2
            exit 1
          fi
      - name: Install system dependencies
        if: inputs.system_dependencies_command != ''
        shell: bash
        run: bash -euo pipefail -c "$SYSTEM_DEPENDENCIES_COMMAND"
      - name: Build Kelvra runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RUNTIME_CMAKE_FLAGS" ]]; then
            read -r -a extra_flags <<< "$RUNTIME_CMAKE_FLAGS"
            cmake -S .package-actions-runtime/kelvra -B .package-actions-runtime/kelvra/build \
              -DCMAKE_BUILD_TYPE=Release "${extra_flags[@]}"
          else
            cmake -S .package-actions-runtime/kelvra -B .package-actions-runtime/kelvra/build \
              -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build .package-actions-runtime/kelvra/build --parallel
      - name: Stage, validate, and test package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/$WORKING_DIRECTORY"
          runtime="$GITHUB_WORKSPACE/.package-actions-runtime/kelvra/build/interpreter"
          module="$(sed -n 's/^module = "\([^"]*\)"/\1/p' "$package_dir/kelvra.toml" | head -n 1)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$package_dir/kelvra.toml" | head -n 1)"
          stage="$RUNNER_TEMP/packages/$module"
          project="$RUNNER_TEMP/package-test"
          mkdir -p "$(dirname "$stage")" "$project"
          rsync -a --exclude .git --exclude .package-actions-runtime --exclude build "$package_dir/" "$stage/"
          "$runtime" validate-package "$stage"
          sed -e "s|__PACKAGE_NAME__|$PACKAGE_NAME|g" \
              -e "s|__PACKAGE_MODULE__|$module|g" \
              -e "s|__PACKAGE_VERSION__|$version|g" \
              -e "s|__PACKAGE_PATH__|$stage|g" \
              "$package_dir/$TEST_FIXTURE" > "$project/kelvra.toml"
          (
            cd "$project"
            KELVRA_CACHE_DIR="$RUNNER_TEMP/kelvra-cache" "$runtime" run "$stage/tests/main.kel"
          )
          if [[ -n "$TEST_COMMAND" ]]; then
            export KELVRA_RUNTIME="$runtime" PACKAGE_STAGE="$stage" PACKAGE_VERSION="$version" PACKAGE_MODULE="$module"
            cd "$package_dir"
            bash -euo pipefail -c "$TEST_COMMAND"
          fi
      - name: Bundle source package and checksum
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/$WORKING_DIRECTORY"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$package_dir/kelvra.toml" | head -n 1)"
          bundle="$RUNNER_TEMP/$PACKAGE_NAME-$version"
          mkdir -p "$bundle" dist
          rsync -a --exclude .git --exclude .github --exclude .package-actions-runtime --exclude build \
            "$package_dir/" "$bundle/"
          tar -C "$RUNNER_TEMP" -czf "dist/$PACKAGE_NAME-$version.tar.gz" "$PACKAGE_NAME-$version"
          cd dist
          sha256sum "$PACKAGE_NAME-$version.tar.gz" > SHA256SUMS
      - name: Upload fixture artifacts
        if: inputs.publish_release == false
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.package_name }}-source-release-fixture
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/${{ inputs.package_name }}-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
